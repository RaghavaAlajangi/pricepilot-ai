services:
  - type: web
    name: pricepilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATASET_PATH
        value: /app/data/dataset.csv
      - key: WEIGHTS_DIR
        value: /app/data/weights
      - key: OPENAI_API_KEY
        sync: false

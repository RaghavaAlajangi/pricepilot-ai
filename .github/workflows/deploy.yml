# Deploys frontend to Vercel and backend to Render.
# Triggered when a version tag (v*.*.*) is pushed.
#
# Required repository secrets (Settings → Secrets and variables → Secrets):
#   VERCEL_TOKEN        — Vercel personal access token
#   VERCEL_ORG_ID       — Vercel team/org ID  (vercel link → .vercel/project.json)
#   VERCEL_PROJECT_ID   — Vercel project ID   (vercel link → .vercel/project.json)
#   RENDER_API_KEY      — Render API key (Account → API Keys)
#   RENDER_SERVICE_ID   — Render service ID (from service URL: srv-xxxxx)

name: Deploy

on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - "v*.*.*"

jobs:
  # ---------------------------------------------------------------------------
  # CI gate — backend lint + tests, frontend lint + build
  # ---------------------------------------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests scripts
      - run: pytest tests -v -m "not agent"
        env:
          DATASET_PATH: ../data/dataset.csv

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Deploy backend to Render
  # ---------------------------------------------------------------------------
  deploy-backend:
    needs: backend-ci
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger Render deploy
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")

          echo "Render API response: $response"
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Render deploy trigger failed with HTTP $response"
            exit 1
          fi

      - name: Wait for Render deploy to complete
        run: |
          echo "Polling Render deploy status..."
          for i in $(seq 1 30); do
            status=$(curl -s \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploy']['status'])")
            echo "Attempt $i/30 — status: $status"
            if [ "$status" = "live" ]; then
              echo "Backend deploy succeeded."
              exit 0
            fi
            if [ "$status" = "deactivated" ] || [ "$status" = "build_failed" ]; then
              echo "Backend deploy failed with status: $status"
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for Render deploy."
          exit 1

  # ---------------------------------------------------------------------------
  # Deploy frontend to Vercel
  # ---------------------------------------------------------------------------
  deploy-frontend:
    needs: frontend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for Vercel
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

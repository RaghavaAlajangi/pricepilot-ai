name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-json-report pytest-cov
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Run tests
        run: pytest tests -v -m "not agent" --json-report --json-report-file=test_report.json --cov=app --cov-report=xml
        env:
          DATASET_PATH: ../data/dataset.csv
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/test_report.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: RaghavaAlajangi/pricepilot-ai
          files: backend/coverage.xml
          flags: backend

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  pr-comment:
    if: github.event_name == 'pull_request'
    needs: [backend-test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: backend
        continue-on-error: true

      - name: Download agent report
        uses: actions/download-artifact@v4
        with:
          name: agent-report
          path: backend
        continue-on-error: true

      - name: Generate PR comment
        id: report
        working-directory: backend
        run: |
          body=$(python scripts/pr_report.py test_report.json agent_report.json tests/agent_baseline.json)
          # Write to a file to handle multi-line safely
          echo "$body" > pr_comment.md

      - name: Post comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: backend/pr_comment.md
